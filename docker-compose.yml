services:
  db:
    image: mariadb:10.11
    container_name: horizon-homes-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${JOOMLA_DB_NAME:-joomla}
      MARIADB_USER: ${JOOMLA_DB_USER:-joomla}
      MARIADB_PASSWORD: ${JOOMLA_DB_PASSWORD:-joomlapass}
    volumes:
      - db_data:/var/lib/mysql
      # Restored automatically on first boot (empty data directory).
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - horizon

  joomla:
    build:
      context: .
      dockerfile: Dockerfile
    image: horizon-homes:latest
    container_name: horizon-homes-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_USER: ${JOOMLA_DB_USER:-joomla}
      JOOMLA_DB_PASSWORD: ${JOOMLA_DB_PASSWORD:-joomlapass}
      JOOMLA_DB_NAME: ${JOOMLA_DB_NAME:-joomla}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/index.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - horizon

volumes:
  db_data:

networks:
  horizon:
    driver: bridge