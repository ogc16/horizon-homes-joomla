name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: Features
    labels: ['feature', 'enhancement']
  - title: Fixes
    labels: ['fix', 'bug']
  - title: Documentation
    labels: ['docs', 'documentation']
  - title: Maintenance
    labels: ['chore', 'refactor', 'dependencies', 'ci', 'build']

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: ['major']
  minor:
    labels: ['minor', 'feature', 'enhancement']
  patch:
    labels: ['patch', 'fix', 'bug', 'chore', 'docs', 'dependencies', 'ci']
  default: patch

template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

autolabeler:
  - label: 'docs'
    files:
      - '*.md'
      - 'docs/**'
  - label: 'ci'
    files:
      - '.github/**'
  - label: 'docker'
    files:
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose.yml'
