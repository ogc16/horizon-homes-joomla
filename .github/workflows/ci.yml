name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Syntax check every component file
        run: |
          find components -name '*.php' -print0 \
            | xargs -0 -n1 -P"$(nproc)" php -l

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          coverage: none
          tools: phpcs

      - name: PHPCS (PSR-12)
        run: phpcs --standard=phpcs.xml.dist

      - name: ShellCheck
        run: shellcheck docker/entrypoint.sh .github/scripts/smoke.sh

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: EditorConfig
        run: |
          curl -fsSL -o /tmp/ec.tar.gz \
            https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v4.0.2/editorconfig-checker-linux-amd64.tar.gz
          tar -xzf /tmp/ec.tar.gz -C /tmp editorconfig-checker
          /tmp/editorconfig-checker

      - name: Yamllint
        run: |
          docker run --rm -v "${{ github.workspace }}:/data" \
            cytopia/yamllint@sha256:3e9eb827ab2b12a5ea5f49d4257bb3aca94bba9f1ba427c8bc7f2456385a5204 \
            -c /data/.yamllint.yaml /data/docker-compose.yml /data/.github

  docker:
    name: Docker build, PHPStan & smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - name: Smoke test
        run: bash .github/scripts/smoke.sh

      - name: Static analysis (PHPStan)
        run: |
          curl -fsSL \
            https://github.com/phpstan/phpstan/releases/latest/download/phpstan.phar \
            -o phpstan.phar
          docker compose cp phpstan.phar joomla:/tmp/phpstan.phar
          docker compose cp phpstan.neon joomla:/var/www/html/phpstan.neon
          docker compose cp phpstan-baseline.neon joomla:/var/www/html/phpstan-baseline.neon
          docker compose cp phpstan-bootstrap.php joomla:/var/www/html/phpstan-bootstrap.php
          docker compose exec -T -w /var/www/html joomla \
            php /tmp/phpstan.phar analyse -c phpstan.neon --no-progress

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
