name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find components templates docker -name '*.php' -type f -print0)
          printf 'Linting %d files\n' "${#files[@]}"
          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P "$(nproc)" php -l

  docker-smoke:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build image
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Smoke test
        run: bash .github/scripts/smoke.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
