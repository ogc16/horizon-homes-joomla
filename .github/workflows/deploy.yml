name: Deploy

on:
  workflow_dispatch:
    inputs:
      image:
        description: Container image reference to deploy
        required: true
        default: ghcr.io/ogc16/horizon-homes-joomla:latest

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Azure Web App (production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://horizon-homes-live.azurewebsites.net
    steps:
      - name: Log in to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: horizon-homes-live
          images: ${{ github.event.inputs.image }}

      - name: Smoke test production
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              https://horizon-homes-live.azurewebsites.net/ || true)
            if [ "$code" = "200" ]; then
              echo "production healthy (HTTP $code)"
              exit 0
            fi
            sleep 6
          done
          echo "production did not become healthy" >&2
          exit 1
